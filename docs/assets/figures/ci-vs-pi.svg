<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480">
<style>text{font-family:Arial,sans-serif;fill:#222}.head{font-size:30px;font-weight:700}.lab{font-size:25px}.small{font-size:20px}.line{stroke:#333;stroke-width:7;stroke-linecap:round}.null{stroke:#888;stroke-width:2;stroke-dasharray:8 8}.pt{fill:#222}</style>
<line x1="520" y1="70" x2="520" y2="370" class="null"/><text x="520" y="410" class="small" text-anchor="middle">No effect</text>
<text x="50" y="130" class="head">95% confidence interval</text><text x="50" y="170" class="lab">uncertainty in the mean</text><line x1="590" y1="145" x2="760" y2="145" class="line"/><circle cx="675" cy="145" r="14" class="pt"/>
<text x="50" y="275" class="head">95% prediction interval</text><text x="50" y="315" class="lab">variation expected among settings</text><line x1="400" y1="290" x2="930" y2="290" class="line"/><circle cx="675" cy="290" r="14" class="pt"/>
<text x="675" y="455" class="small" text-anchor="middle">Same estimated mean — different questions</text>
</svg>