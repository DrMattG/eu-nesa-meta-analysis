<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
<style>text{font-family:Arial,sans-serif;fill:#222}.lab{font-size:25px}.small{font-size:20px}.head{font-size:28px;font-weight:700}.axis{stroke:#333;stroke-width:2}.ci{stroke:#333;stroke-width:4}.null{stroke:#777;stroke-width:2;stroke-dasharray:8 8}.pt{fill:#222}.pool{fill:#555}</style>
<text x="45" y="55" class="head">Study</text><text x="750" y="55" class="head">Response ratio</text>
<line x1="760" y1="90" x2="760" y2="490" class="null"/><text x="760" y="530" class="small" text-anchor="middle">1.0 (no difference)</text>
<text x="45" y="140" class="lab">Study A</text><line x1="650" y1="130" x2="845" y2="130" class="ci"/><circle cx="735" cy="130" r="10" class="pt"/>
<text x="45" y="215" class="lab">Study B</text><line x1="700" y1="205" x2="910" y2="205" class="ci"/><circle cx="800" cy="205" r="14" class="pt"/>
<text x="45" y="290" class="lab">Study C</text><line x1="785" y1="280" x2="1000" y2="280" class="ci"/><circle cx="875" cy="280" r="9" class="pt"/>
<text x="45" y="365" class="lab">Study D</text><line x1="610" y1="355" x2="805" y2="355" class="ci"/><circle cx="700" cy="355" r="12" class="pt"/>
<text x="45" y="455" class="head">Pooled mean</text><polygon points="760,435 820,455 760,475 700,455" class="pool"/>
<line x1="560" y1="500" x2="1020" y2="500" class="axis"/><text x="560" y="545" class="small" text-anchor="middle">lower</text><text x="1020" y="545" class="small" text-anchor="middle">higher</text>
<text x="920" y="120" class="small">line = 95% CI</text><text x="920" y="160" class="small">point size ≈ precision</text><text x="920" y="455" class="small">diamond = pooled mean + CI</text>
</svg>